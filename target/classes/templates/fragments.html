<!DOCTYPE html>


<!--This ll use to reuse of nav bar fevicon icon Favicon loaded once
✔ SEO per page
✔ Easy maintenance
✔ Clean Git diffs
✔ Production ready
✔ Scales to 50+ pages-->

<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title, description)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title th:text="${title}">Tarana Soya Foods</title>
  <meta name="description" th:content="${description}">

  <!-- Favicons -->
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FoodEstablishment",
      "name": "Tarana Soya Foods",
      "url": "https://www.taranasoyafoods.com/",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Nagpur",
        "addressRegion": "MH",
        "addressCountry": "IN"
      },
      "hasCredential": [
        {
          "@type": "EducationalOccupationalCredential",
          "credentialCategory": "FSSAI License",
          "identifier": "21524077000116"
        },
        {
          "@type": "EducationalOccupationalCredential",
          "credentialCategory": "ISO 9001:2015 Certification"
        }
      ]
    }
  </script>


  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Global CSS -->
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
<!-- Navbar -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg fixed-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center fw-bold brand-text" href="/">
      <img src="/image/logo.png" width="90" height="60" class="me-2">
      Tarana Soya Foods
    </a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div id="nav" class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="/gallery">Gallery</a></li>
        <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Footer -->
<footer th:fragment="footer" class="footer">
  <p class="footer-copy">
    FSSAI Registered Food Business<br>
    © 2026 Tarana Soya Foods, Nagpur — All Rights Reserved.
  </p>
</footer>
</body>
</html>
