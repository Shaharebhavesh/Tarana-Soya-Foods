<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Your Cart | Tarana Soya Foods</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background:#f6f9f7; padding-top:80px; }
    .cart-card { border-radius:12px; }
  </style>
</head>
<body>


<div class="container">
  <h2 class="text-center mb-4 text-success fw-bold">🛒 Your Cart</h2>

  <div class="card cart-card shadow-sm p-3" th:if="${cartItems.size() > 0}">
    <table class="table align-middle">
      <thead>
      <tr>
        <th>Product</th>
        <th>Qty</th>
        <th>Price</th>
        <th>Total</th>
      </tr>
      </thead>

      <tbody>
      <tr th:each="item : ${cartItems}">
        <td th:text="${item.name}"></td>
        <td th:text="${item.quantity}"></td>
        <td>₹ <span th:text="${item.price}"></span></td>
        <td>₹ <span th:text="${item.total}"></span></td>
      </tr>
      </tbody>
    </table>

    <h4 class="text-end mt-3">
      Total: ₹ <span th:text="${total}"></span>
    </h4>

    <div class="text-end mt-3">
      <a href="/checkout" class="btn btn-success px-4">
        Proceed to Checkout →
      </a>
    </div>
  </div>

  <div class="alert alert-warning text-center" th:if="${cartItems.size() == 0}">
    Your cart is empty.
  </div>
</div>

</body>
</html>
