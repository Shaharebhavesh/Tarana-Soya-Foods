<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout | Tarana Soya Foods</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background:#f6f9f7; padding-top:80px; }
        .checkout-card { border-radius:15px; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center text-success fw-bold mb-4">🧾 Checkout</h2>

    <div class="card checkout-card shadow-sm p-4 col-md-6 mx-auto">
        <form method="post" action="/order/place">

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="tel" name="phone" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Delivery Address</label>
                <textarea name="address" class="form-control" rows="3" required></textarea>
            </div>

            <div class="d-grid gap-2 mt-4">
                <button type="submit" name="payment" value="COD"
                        class="btn btn-success btn-lg">
                    🚚 Cash on Delivery
                </button>

                <button type="submit" name="payment" value="ONLINE"
                        class="btn btn-outline-success btn-lg">
                    💳 Pay Online
                </button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
